
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fashion Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: #e8d8c3;
        }

        .hero h2 {
            font-size: 35px;
        }

        .hero button {
            padding: 12px 25px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        .products {
            text-align: center;
            padding: 30px;
        }

        .product {
            background: white;
            padding: 25px;
            margin: 15px auto;
            max-width: 300px;
            border-radius: 10px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>MY FASHION</h1>
    <p>Your Style, Your Identity</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
</nav>

<section class="hero">
    <h2>Welcome to My Fashion</h2>
    <p>Discover Your Perfect Style</p>
    <button onclick="alert('Welcome to My Fashion!')">
        Shop Now
    </button>
</section>

<section class="products" id="products">
    <h2>Our Products</h2>

    <div class="product">
        <h3>Stylish T-Shirt</h3>
        <p>Price: ৳500</p>
    </div>

    <div class="product">
        <h3>Fashion Shirt</h3>
        <p>Price: ৳800</p>
    </div>

    <div class="product">
        <h3>Premium Hoodie</h3>
        <p>Price: ৳1200</p>
    </div>
</section>

<footer id="contact">
    <p>Contact Us</p>
    <p>Welcome to My Fashion Website</p>
</footer>

</body>
</html>
